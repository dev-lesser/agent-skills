[project]
name = "dev-lesser-agent-skills"
version = "0.2.0"
description = "Versioned portable engineering skills and opt-in advisory hooks"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.4,<9", "pyyaml==6.0.3"]
eval-test = ["fastapi==0.162.0", "httpx==0.28.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
